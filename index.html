<title>選手データ管理</title>
<style>
:root{--navy:#14284b;--red:#c8102e;--bg:#f3f4f6;--line:#e3e6eb;--mut:#6b7280;--g:#16a34a;--b:#2563eb;--o:#ea580c}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:#111827;-webkit-text-size-adjust:100%}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.ball{width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:inset 3px 0 0 -1px var(--red),inset -3px 0 0 -1px var(--red)}
.st{font-size:12px;opacity:.8}
.tabs{display:flex;background:var(--navy);padding:0 8px}
.tabs a{flex:1;text-align:center;color:#cbd5e1;text-decoration:none;padding:10px;font-size:14px;border-bottom:3px solid transparent}
.tabs a.on{color:#fff;border-color:var(--red);font-weight:700}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h1 small{font-size:13px;color:var(--mut);font-weight:400}
h2{font-size:16px;margin:24px 0 8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.btn{font:inherit;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:#111827;cursor:pointer;font-weight:600}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--red);border-color:transparent}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:14px;padding:28px 20px;text-align:center;color:var(--mut);font-size:14px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pcard{display:block;background:#fff;border-radius:14px;padding:14px;text-decoration:none;color:inherit;border:1px solid var(--line)}
.pn{font-weight:700;font-size:16px}.pm{color:var(--mut);font-size:13px;margin-top:2px;font-weight:400}
.pr{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:700}
.pr .pbar{flex:1;margin:0}
.pd{font-size:12px;color:var(--mut);margin-top:6px}
.pbar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.pbar.g i{background:var(--g)}.pbar.b i{background:var(--b)}.pbar.o i{background:var(--o)}
.back{display:inline-block;color:var(--navy);text-decoration:none;font-size:14px;margin-bottom:8px}
.phead{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.ov{text-align:center}.ov b{display:block;font-size:24px;color:var(--navy)}.ov span{font-size:11px;color:var(--mut)}
.acts{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.acts .pri{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:#fff;border-radius:14px;padding:12px;border:1px solid var(--line)}
.card.done{border-color:var(--g);box-shadow:0 0 0 1px var(--g) inset}
.mn{font-size:12px;color:var(--mut);font-weight:600}
.cv{font-size:24px;font-weight:800;margin-top:4px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cv small{font-size:12px;font-weight:600;color:var(--mut);margin-left:2px}
.na{font-size:15px;color:#9ca3af;font-weight:600}

<body>
<div id="root"></div>
<script type="module">
// ===== 設定（ここだけ書き換えてください） =====================
// ① Firebaseコンソールの「マイアプリ」に表示される firebaseConfig をそのまま貼り付け
const firebaseConfig = {
  apiKey: "AIzaSyC3ZG93D4fgiSTkBY_g_NZnx3YZRNjPkUA",
  authDomain: "baseball-8c7fc.firebaseapp.com",
  projectId: "baseball-8c7fc",
  storageBucket: "baseball-8c7fc.firebasestorage.app",
  messagingSenderId: "588514569699",
  appId: "1:588514569699:web:f01131052ee63b9d19c4d6",
  measurementId: "G-7XTD6QGDW8"
};
// ② 入力（記録・目標設定・選手追加）ができる人のログインID
//    ※ firestore.rules の一覧と必ず同じにしてください
const COACH_IDS = ["chonan", "t.nakayama", "h.nakayama", "imada", "abe", "namioka", "toriyabe", "sakamoto", "kimura"];
// ③ ログインIDの後ろに自動で付ける文字（変更不要）
const ID_DOMAIN = "team.local";
// =============================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const M = [
  { k: 'velo', n: '球速', u: 'km/h' },
  { k: 'squat', mx: true, n: 'スクワット', u: 'kg' },
  { k: 'dead', mx: true, n: 'デッドリフト', u: 'kg' },
  { k: 'bench', mx: true, n: 'ベンチプレス', u: 'kg' },
  { k: 'bulgarian', mx: true, n: 'ブルガリアンスクワット', u: 'kg' },
  { k: 'rdl', mx: true, n: 'ルーマニアンデッドリフト', u: 'kg' },
  { k: 'backlunge', mx: true, n: 'バックランジ', u: 'kg' },
  { k: 'sidelunge', mx: true, n: 'サイドランジ', u: 'kg' },
  { k: 'mb', n: 'メディシンボール投げ', u: 'm' },
  { k: 'swing', n: 'スイングスピード', u: 'km/h' },
  { k: 'weight', n: '体重', u: 'kg' },
  { k: 'fat', n: '体脂肪率', u: '%' }
];
const POS = ['投手', '捕手', '一塁手', '二塁手', '三塁手', '遊撃手', '外野手'];
const GR = ['1年', '2年', '3年'];

let S = { players: [] }, sortK = null, status = '', loaded = false, authReady = false, user = null, isCoach = false, unsub = null;
let auth = null, fs = null;
let logs = [], logsLoaded = false, logsPid = null, logsUnsub = null;
const configured = !String(firebaseConfig.apiKey).startsWith('ここ');

const toEmail = id => { id = String(id || '').trim().toLowerCase(); return id.includes('@') ? id : id + '@' + ID_DOMAIN; };
const showId = email => { email = String(email || ''); return email.endsWith('@' + ID_DOMAIN) ? email.slice(0, -ID_DOMAIN.length - 1) : email; };

if (configured) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  fs = getFirestore(app);
  onAuthStateChanged(auth, u => {
    user = u; authReady = true;
    if (unsub) { unsub(); unsub = null; }
    if (logsUnsub) { logsUnsub(); logsUnsub = null; } logsPid = null; logs = []; logsLoaded = false;
    S.players = []; loaded = false; setStatus('');
    if (u) {
      isCoach = COACH_IDS.map(toEmail).includes(String(u.email || '').toLowerCase());
      unsub = onSnapshot(collection(fs, 'players'), snap => {
        S.players = snap.docs.map(d => {
          const x = d.data() || {};
          return { id: d.id, name: x.name || '', grade: x.grade || '', pos: x.pos || '', account: x.account || '', targets: x.targets || {}, records: x.records || [], updatedAt: x.updatedAt || '', updatedBy: x.updatedBy || '' };
        });
        loaded = true; render();
      }, err => { loaded = true; setStatus(err && err.code === 'permission-denied' ? 'denied' : 'err'); render(); });
    }
    render();
  });
}

/* ---------- 共通 ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const num = x => (x == null || x === '' || isNaN(+x)) ? null : +x;
const fmt = v => v == null ? '—' : String(Math.round(v * 10) / 10);
const series = (p, k) => p.records.filter(r => num(r.values && r.values[k]) != null).sort((a, b) => a.date.localeCompare(b.date)).map(r => ({ date: r.date, v: +r.values[k] }));
const cur = (p, k) => { const s = series(p, k); return s.length ? s[s.length - 1].v : null; };
function prog(p, k) {
  const t = num(p.targets[k]), s = series(p, k); if (t == null || !s.length) return null;
  const st = s[0].v, c = s[s.length - 1].v, reached = t >= st ? c >= t : c <= t;
  if (reached) return 1; if (t === st) return 0;
  return Math.max(0, Math.min(1, (c - st) / (t - st)));
}
function overall(p) { const a = M.map(m => prog(p, m.k)).filter(x => x != null); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
const lastDate = p => p.records.reduce((m, r) => r.date > m ? r.date : m, '');
const barCls = pr => pr == null ? '' : pr >= 1 ? 'g' : pr >= .5 ? 'b' : 'o';
const sorted = () => S.players.slice().sort((a, b) => GR.indexOf(b.grade) - GR.indexOf(a.grade) || a.name.localeCompare(b.name, 'ja'));
const pct = x => Math.round(x * 100) + '%';
const rw = h => isCoach ? h : '';
const myEmail = () => String(user && user.email || '').toLowerCase();
const isMine = p => !!(p && p.account && p.account === myEmail());
const canRec = p => isCoach || isMine(p);
const rec = (p, h) => canRec(p) ? h : '';
const myPlayer = () => S.players.find(isMine);
const find = id => S.players.find(x => x.id === id);

/* ---------- 保存 ---------- */
const ST = { saving: '保存中…', saved: '保存しました', err: '通信エラー', denied: '権限がありません', ro: '閲覧のみ' };
function setStatus(s) { status = s; const el = document.getElementById('st'); if (el) el.textContent = ST[s] || ''; }
const chains = {};
function queue(id, fn) {
  setStatus('saving');
  chains[id] = (chains[id] || Promise.resolve()).then(fn).then(() => setStatus('saved'), e => setStatus(e && e.code === 'permission-denied' ? 'denied' : 'err'));
}
function save(p) {
  const stamp = { updatedAt: new Date().toISOString(), updatedBy: showId(user && user.email) };
  if (!isCoach) { // 選手本人は測定記録だけを更新
    queue(p.id, () => updateDoc(doc(fs, 'players', p.id), Object.assign({ records: p.records }, stamp)));
    return;
  }
  const body = Object.assign({ name: p.name, grade: p.grade, pos: p.pos, account: p.account || '', targets: p.targets, records: p.records }, stamp);
  queue(p.id, () => setDoc(doc(fs, 'players', p.id), body));
}
function removeP(p) { queue(p.id, () => deleteDoc(doc(fs, 'players', p.id))); }

/* ---------- 画面 ---------- */
function route() { const h = location.hash.slice(1); if (h === 'team') return { v: 'team' }; if (h.indexOf('p-') === 0) return { v: 'player', id: h.slice(2) }; if (h.indexOf('t-') === 0) return { v: 'train', id: h.slice(2) }; return { v: 'home' }; }
function render() {
  const root = document.getElementById('root');
  if (!configured) { root.innerHTML = '<div class="login"><div class="lbox"><h1>初期設定が必要です</h1><p class="hint">index.html の先頭にある firebaseConfig に、Firebaseの設定値を貼り付けてください（手順書の「手順4」）。</p></div></div>'; return; }
  if (!authReady) { root.innerHTML = '<div class="login"><div class="lbox"><p class="hint">読み込み中…</p></div></div>'; return; }
  if (!user) { root.innerHTML = loginView(); return; }
  const r = route();
  ensureLogs(r.v === 'train' && loaded && find(r.id) ? r.id : null);
  let h = '<header class="top"><div class="brand"><span class="ball"></span>選手データ管理</div><div class="hr"><span class="st" id="st">' + (ST[status] || '') + '</span><button class="acct" data-act="account">' + esc(showId(user.email)) + ' ▾</button></div></header>' +
    '<nav class="tabs"><a href="#" class="' + (r.v !== 'team' ? 'on' : '') + '">選手</a><a href="#team" class="' + (r.v === 'team' ? 'on' : '') + '">チーム一覧</a></nav><main>';
  if (!isCoach && loaded) {
    const mp = myPlayer();
    h += mp ? '<a class="mine" href="#p-' + mp.id + '"><span>あなたの記録</span><b>' + esc(mp.name) + '</b><em>測定・トレーニングを入力する ›</em></a>'
      : '<p class="hint ro">あなたのIDはまだ選手に紐付けられていないため、閲覧のみです。コーチに「選手情報の編集」でログインIDを登録してもらってください。</p>';
  }
  if (!loaded) h += '<div class="empty">読み込み中…</div>';
  else if (r.v === 'team') h += teamView();
  else if (r.v === 'player') { const p = find(r.id); h += p ? playerView(p) : homeView(); }
  else if (r.v === 'train') { const p = find(r.id); h += p ? trainView(p) : homeView(); }
  else h += homeView();
  root.innerHTML = h + '</main>';
}
function loginView() {
  return '<div class="login"><form class="lbox" id="loginForm"><div class="lbrand"><span class="ball big"></span><h1>選手データ管理</h1></div>' +
    '<label>ログインID<input name="lid" autocomplete="username" autocapitalize="none" spellcheck="false"></label>' +
    '<label>パスワード<input name="pw" type="password" autocomplete="current-password"></label>' +
    '<p class="err" id="loginErr"></p><button class="btn pri wide" type="submit">ログイン</button>' +
    '<p class="hint">IDとパスワードはコーチから受け取ってください。</p></form></div>';
}
function homeView() {
  const ps = sorted();
  let h = '<div class="bar"><h1>選手一覧 <small>' + ps.length + '名</small></h1>' + rw('<button class="btn pri" data-act="addPlayer">＋ 選手を追加</button>') + '</div>';
  if (!ps.length) return h + '<div class="empty"><p>まだ選手が登録されていません。</p>' + rw('<p>「＋ 選手を追加」から登録し、目標値と測定値を入力していきましょう。</p>') + '</div>';
  return h + '<div class="plist">' + ps.map(p => {
    const o = overall(p), ld = lastDate(p);
    return '<a class="pcard" href="#p-' + p.id + '"><div class="pn">' + esc(p.name) + '</div><div class="pm">' + esc(p.grade) + '　' + esc(p.pos) + '</div>' +
      '<div class="pr"><div class="pbar ' + barCls(o) + '"><i style="width:' + (o == null ? 0 : pct(o)) + '"></i></div><span>' + (o == null ? '目標未設定' : pct(o)) + '</span></div>' +
      '<div class="pd">' + (ld ? '最終測定 ' + esc(ld.replace(/-/g, '/')) : '測定なし') + '</div></a>';
  }).join('') + '</div>';
}
function headHtml(p, tab) {
  const o = overall(p);
  return '<a class="back" href="#">‹ 選手一覧</a><div class="phead"><div><h1>' + esc(p.name) + '</h1><div class="pm">' + esc(p.grade) + ' ・ ' + esc(p.pos) + '</div></div><div class="ov"><b>' + (o == null ? '—' : pct(o)) + '</b><span>目標達成度</span></div></div>' +
    '<div class="seg"><a href="#p-' + p.id + '" class="' + (tab === 'p' ? 'on' : '') + '">測定（MAX）</a><a href="#t-' + p.id + '" class="' + (tab === 't' ? 'on' : '') + '">トレーニング記録</a></div>';
}
function playerView(p) {
  return headHtml(p, 'p') +
    (p.updatedAt ? '<p class="hint">最終更新 ' + esc(p.updatedAt.slice(0, 10).replace(/-/g, '/')) + (p.updatedBy ? '・' + esc(p.updatedBy) : '') + '</p>' : '') +
    (isCoach ? '<div class="acts"><button class="btn pri" data-act="record">測定を記録</button><button class="btn" data-act="targets">目標を設定</button><button class="btn" data-act="editPlayer">編集</button></div>'
      : isMine(p) ? '<div class="acts"><button class="btn pri" data-act="record">測定を記録</button></div><p class="hint">目標値はコーチが設定します。</p>' : '') +
    '<div class="grid" style="margin-top:12px">' + M.map(m => card(p, m)).join('') + '</div>' + historyTable(p) +
    rw('<div class="danger"><button class="btn ghost" data-act="delPlayer">この選手を削除</button></div>');
}
function card(p, m) {
  const s = series(p, m.k), t = num(p.targets[m.k]), c = s.length ? s[s.length - 1].v : null, pv = s.length > 1 ? s[s.length - 2].v : null, pr = prog(p, m.k), done = pr != null && pr >= 1;
  let delta = '';
  if (c != null && pv != null) {
    const d = c - pv; let cls = '';
    if (t != null && d !== 0) cls = (d > 0) === (t - pv > 0) ? 'good' : 'bad';
    delta = '<span class="dl ' + cls + '">' + (d > 0 ? '▲' : d < 0 ? '▼' : '±') + fmt(Math.abs(d)) + '</span>';
  }
  let rem = ''; if (t != null && c != null) rem = done ? '<span class="ok">達成！</span>' : 'あと ' + fmt(Math.abs(t - c)) + m.u;
  return '<div class="card' + (done ? ' done' : '') + '"><div class="mn">' + m.n + (m.mx ? ' <i class="mx">MAX</i>' : '') + '</div>' +
    '<div class="cv">' + (c == null ? '<span class="na">未測定</span>' : fmt(c) + '<small>' + m.u + '</small>') + delta + '</div>' +
    '<div class="tg"><span>' + (t == null ? '目標未設定' : '目標 ' + fmt(t) + m.u) + '</span><span>' + rem + '</span></div>' +
    '<div class="pbar ' + barCls(pr) + '"><i style="width:' + (pr == null ? 0 : pct(pr)) + '"></i></div>' + spark(s, t) + '</div>';
}
function spark(s, t) {
  if (s.length < 2) return '';
  const w = 120, h = 36, pd = 3, vals = s.map(x => x.v); if (t != null) vals.push(t);
  let mn = Math.min(...vals), mx = Math.max(...vals); if (mn === mx) { mn -= 1; mx += 1; }
  const X = i => (pd + i * (w - 2 * pd) / (s.length - 1)).toFixed(1), Y = v => (h - pd - (v - mn) * (h - 2 * pd) / (mx - mn)).toFixed(1);
  const tl = t != null ? '<line class="tl" x1="0" x2="' + w + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/>' : '';
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' + tl + '<polyline points="' + s.map((x, i) => X(i) + ',' + Y(x.v)).join(' ') + '"/></svg>';
}
function historyTable(p) {
  const rs = p.records.slice().sort((a, b) => b.date.localeCompare(a.date));
  if (!rs.length) return '<h2>測定履歴</h2><div class="empty">' + (canRec(p) ? '「測定を記録」から最初のデータを入力してください。' : 'まだ測定記録がありません。') + '</div>';
  return '<h2>測定履歴</h2><div class="tw"><table><thead><tr><th>日付</th>' + M.map(m => '<th>' + m.n + '<small>' + m.u + '</small></th>').join('') + rec(p, '<th></th>') + '</tr></thead><tbody>' +
    rs.map(r => '<tr><td>' + esc(r.date.slice(2).replace(/-/g, '/')) + '</td>' + M.map(m => '<td>' + fmt(num(r.values[m.k])) + '</td>').join('') + rec(p, '<td><button class="mini" data-act="editRec" data-date="' + esc(r.date) + '">編集</button></td>') + '</tr>').join('') +
    '</tbody></table></div><p class="hint">表は横にスクロールできます。</p>';
}
function teamView() {
  const ps = sorted();
  if (!ps.length) return '<div class="empty"><p>選手を追加すると、ここにチーム全体の一覧が表示されます。</p></div>';
  const rows = ps.map(p => ({ p, o: overall(p) }));
  if (sortK) rows.sort((a, b) => {
    const av = sortK === 'o' ? a.o : cur(a.p, sortK), bv = sortK === 'o' ? b.o : cur(b.p, sortK);
    if (av == null) return 1; if (bv == null) return -1; return bv - av;
  });
  return '<div class="bar"><h1>チーム一覧</h1><button class="btn" data-act="csv">CSV出力</button></div>' +
    '<p class="hint">見出しをタップで並べ替え（高い順）。セルは「現在 / 目標」、色は達成度（緑＝達成、青＝50%以上、橙＝50%未満）。</p>' +
    '<div class="tw"><table class="tt"><thead><tr><th>選手</th><th data-act="sort" data-k="o" class="' + (sortK === 'o' ? 'on' : '') + '">達成度</th>' +
    M.map(m => '<th data-act="sort" data-k="' + m.k + '" class="' + (sortK === m.k ? 'on' : '') + '">' + m.n + '<small>' + m.u + '</small></th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => {
      const p = r.p;
      return '<tr><td><a href="#p-' + p.id + '">' + esc(p.name) + '<div class="pm">' + esc(p.grade) + ' ' + esc(p.pos) + '</div></a></td><td class="' + barCls(r.o) + '"><b>' + (r.o == null ? '—' : pct(r.o)) + '</b></td>' +
        M.map(m => { const pr = prog(p, m.k); return '<td class="' + barCls(pr) + '"><b>' + fmt(cur(p, m.k)) + '</b><span>/ ' + fmt(num(p.targets[m.k])) + '</span></td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table></div>';
}

/* ---------- モーダル ---------- */
function modal(title, body, onSave, o) {
  o = o || {};
  const m = document.createElement('div'); m.className = 'mask';
  m.innerHTML = '<form class="sheet" novalidate><div class="sh"><h3>' + title + '</h3><button type="button" class="x" data-close>×</button></div><div class="sb">' + body + '<p class="err"></p></div><div class="sf">' + (o.extra || '') + (o.noCancel ? '' : '<button type="button" class="btn" data-close>キャンセル</button>') + (o.noOk ? '' : '<button class="btn pri" type="submit">' + (o.ok || '保存') + '</button>') + '</div></form>';
  document.body.appendChild(m);
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); });
  m.querySelector('form').addEventListener('submit', e => {
    e.preventDefault();
    const btn = m.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
    Promise.resolve(onSave(new FormData(e.target), m)).then(err => {
      if (btn) btn.disabled = false;
      if (err) { m.querySelector('.err').textContent = err; return; }
      m.remove(); render();
    });
  });
  if (o.setup) o.setup(m);
  return m;
}
const opts = (list, sel) => list.map(x => '<option' + (x === sel ? ' selected' : '') + '>' + x + '</option>').join('');
function playerForm(p) {
  const body = '<label>名前<input name="name" value="' + esc(p ? p.name : '') + '" placeholder="例：山田 太郎"></label>' +
    '<label>学年<select name="grade">' + opts(GR, p ? p.grade : '1年') + '</select></label>' +
    '<label>ポジション<select name="pos">' + opts(POS, p ? p.pos : '投手') + '</select></label>' +
    '<label>本人のログインID<span class="u">任意・入れると本人が自分の記録を入力できます</span><input name="acct" autocapitalize="none" spellcheck="false" value="' + esc(p && p.account ? showId(p.account) : '') + '" placeholder="例：yamada01"></label>';
  modal(p ? '選手情報の編集' : '選手を追加', body, fd => {
    const name = String(fd.get('name') || '').trim(); if (!name) return '名前を入力してください';
    const a = String(fd.get('acct') || '').trim(), account = a ? toEmail(a) : '';
    if (account && S.players.some(x => x !== p && x.account === account)) return 'このログインIDは別の選手に登録済みです';
    if (p) { p.name = name; p.grade = fd.get('grade'); p.pos = fd.get('pos'); p.account = account; save(p); }
    else { const np = { id: uid(), name, grade: fd.get('grade'), pos: fd.get('pos'), account, targets: {}, records: [] }; S.players.push(np); save(np); location.hash = 'p-' + np.id; }
  });
}
function recordForm(p, date) {
  const ex = date ? p.records.find(r => r.date === date) : null;
  const body = '<label>測定日<input type="date" name="date" value="' + (ex ? ex.date : today()) + '"></label><div class="fgrid">' +
    M.map(m => {
      const last = cur(p, m.k), v = ex && num(ex.values[m.k]) != null ? ex.values[m.k] : '';
      return '<label>' + m.n + (m.mx ? ' <i class="mx">MAX</i>' : '') + '<span class="u">' + m.u + '</span><input name="' + m.k + '" type="number" step="any" inputmode="decimal" value="' + v + '" placeholder="' + (last != null ? '前回 ' + fmt(last) : '') + '"></label>';
    }).join('') +
    '</div><p class="hint">MAXの項目は、1回挙げられる最大重量を入力します。日々の重量×回数は「トレーニング記録」へ。<br>' + (ex ? '空欄にした項目はこの日の記録から消えます。' : '測った項目だけ入力すればOK。同じ日付の記録があれば追記されます。') + '</p>';
  modal(ex ? '測定記録の編集' : '測定を記録', body, fd => {
    const d = fd.get('date'); if (!d) return '測定日を入力してください';
    const vals = {}; M.forEach(m => { const v = num(fd.get(m.k)); if (v != null) vals[m.k] = v; });
    if (!Object.keys(vals).length) return ex ? '値が空です。記録ごと消す場合は「この記録を削除」を押してください' : '値を1つ以上入力してください';
    if (ex) p.records = p.records.filter(r => r !== ex);
    const tg = p.records.find(r => r.date === d);
    if (tg) Object.assign(tg.values, vals); else p.records.push({ date: d, values: vals });
    save(p);
  }, {
    extra: ex ? '<button type="button" class="btn ghost" data-delrec>この記録を削除</button>' : '', setup: m => {
      const b = m.querySelector('[data-delrec]'); if (!b) return;
      b.onclick = () => { if (b.dataset.c) { p.records = p.records.filter(r => r !== ex); m.remove(); save(p); render(); } else { b.dataset.c = 1; b.textContent = 'もう一度押すと削除'; } };
    }
  });
}
function targetForm(p) {
  const body = '<div class="fgrid">' + M.map(m => {
    const c = cur(p, m.k), t = num(p.targets[m.k]);
    return '<label>' + m.n + '<span class="u">' + m.u + (c != null ? '・現在 ' + fmt(c) : '') + '</span><input name="' + m.k + '" type="number" step="any" inputmode="decimal" value="' + (t == null ? '' : t) + '"></label>';
  }).join('') +
    '</div><p class="hint">体脂肪率など下げたい項目は、現在より低い値を目標にすれば自動で「下げる目標」として計算されます。達成度は最初の測定値から目標までの進み具合です。</p>';
  modal('目標値の設定', body, fd => {
    const t = {}; M.forEach(m => { const v = num(fd.get(m.k)); if (v != null) t[m.k] = v; }); p.targets = t; save(p);
  });
}
function delForm(p) {
  modal('選手の削除', '<p>「' + esc(p.name) + '」とすべての測定記録を削除します。元に戻せません。</p>', () => {
    S.players = S.players.filter(x => x !== p); removeP(p); location.hash = '';
  }, { ok: '削除する' });
}
function csvText() {
  const lines = [['選手', '学年', 'ポジション', '測定日'].concat(M.map(m => m.n + '(' + m.u + ')'))];
  sorted().forEach(p => {
    lines.push([p.name, p.grade, p.pos, '目標'].concat(M.map(m => p.targets[m.k] == null ? '' : p.targets[m.k])));
    p.records.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(r => lines.push([p.name, p.grade, p.pos, r.date].concat(M.map(m => r.values[m.k] == null ? '' : r.values[m.k]))));
  });
  return lines.map(l => l.map(x => { x = String(x); return /[",\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(',')).join('\n');
}
function csvModal() {
  modal('CSV出力', '<p class="hint">コピーしてExcelやスプレッドシートに貼り付けできます。</p><textarea readonly>' + esc(csvText()) + '</textarea>', () => { }, {
    ok: '閉じる', noCancel: true, extra: '<button type="button" class="btn" data-copy>コピー</button>',
    setup: m => {
      const b = m.querySelector('[data-copy]'), ta = m.querySelector('textarea');
      b.onclick = () => { navigator.clipboard.writeText(ta.value).then(() => { b.textContent = 'コピーしました'; }, () => { ta.select(); b.textContent = '選択済み：長押しでコピー'; }); };
    }
  });
}
function accountModal() {
  const body = '<p><b>' + esc(showId(user.email)) + '</b>（' + (isCoach ? 'コーチ：すべて入力できます' : myPlayer() ? '選手：自分の測定記録を入力できます' : '閲覧のみ') + '）</p>' +
    '<h2 style="margin-top:8px">パスワードの変更</h2>' +
    '<label>新しいパスワード（6文字以上）<input name="pw1" type="password" autocomplete="new-password"></label>' +
    '<label>もう一度<input name="pw2" type="password" autocomplete="new-password"></label>';
  modal('アカウント', body, fd => {
    const a = String(fd.get('pw1') || ''), b = String(fd.get('pw2') || '');
    if (a.length < 6) return 'パスワードは6文字以上にしてください';
    if (a !== b) return '2つのパスワードが一致しません';
    return updatePassword(auth.currentUser, a).then(() => { setStatus(''); }, e => e && e.code === 'auth/requires-recent-login' ? '安全のため、一度ログアウトして再ログインしてから変更してください' : '変更できませんでした（' + (e && e.code || 'エラー') + '）');
  }, {
    ok: 'パスワードを変更', extra: '<button type="button" class="btn ghost" data-logout>ログアウト</button>',
    setup: m => { m.querySelector('[data-logout]').onclick = () => { m.remove(); location.hash = ''; signOut(auth); }; }
  });
}

/* ---------- トレーニング記録 ---------- */
const EX = ['スクワット', 'デッドリフト', 'ベンチプレス', 'ブルガリアンスクワット', 'ルーマニアンデッドリフト', 'バックランジ', 'サイドランジ'];
const e1rm = (w, r) => !w || !r ? 0 : r === 1 ? w : w * (1 + r / 30);
const fmtD = d => { const x = new Date(d + 'T00:00:00'); return d.replace(/-/g, '/') + '（' + '日月火水木金土'[x.getDay()] + '）'; };
function ensureLogs(pid) {
  if (pid === logsPid) return;
  if (logsUnsub) { logsUnsub(); logsUnsub = null; }
  logs = []; logsLoaded = false; logsPid = pid;
  if (!pid) return;
  logsUnsub = onSnapshot(query(collection(fs, 'logs'), where('playerId', '==', pid)), snap => {
    logs = snap.docs.map(d => { const x = d.data() || {}; return { id: d.id, date: x.date || '', items: x.items || [] }; });
    logsLoaded = true; render();
  }, err => { logsLoaded = true; setStatus(err && err.code === 'permission-denied' ? 'denied' : 'err'); render(); });
}
function saveDay(p, date, items) {
  const id = p.id + '_' + date;
  if (!items.length) { queue(id, () => deleteDoc(doc(fs, 'logs', id))); return; }
  const body = { playerId: p.id, date, items, updatedAt: new Date().toISOString(), updatedBy: showId(user && user.email) };
  queue(id, () => setDoc(doc(fs, 'logs', id), body));
}
function trainView(p) {
  let h = headHtml(p, 't');
  if (canRec(p)) h += '<div class="acts"><button class="btn pri" data-act="addLog">＋ トレーニングを記録</button></div>';
  if (!logsLoaded) return h + '<div class="empty">読み込み中…</div>';
  const days = logs.filter(d => d.items.length).sort((a, b) => b.date.localeCompare(a.date));
  if (!days.length) return h + '<div class="empty">' + (canRec(p) ? '「＋ トレーニングを記録」から、その日の種目・重量・回数を入力してください。' : 'まだトレーニング記録がありません。') + '</div>';
  const best = {};
  days.forEach(d => d.items.forEach(it => {
    const b = best[it.ex] || (best[it.ex] = { w: 0, wr: 0, e: 0, last: '' });
    (it.sets || []).forEach(s => { if (s.w > b.w || (s.w === b.w && s.r > b.wr)) { b.w = s.w; b.wr = s.r; } const e = e1rm(s.w, s.r); if (e > b.e) b.e = e; });
    if (d.date > b.last) b.last = d.date;
  }));
  h += '<h2>種目別ベスト</h2><div class="tw"><table><thead><tr><th>種目</th><th>最高重量</th><th>推定MAX<small>計算値</small></th><th>最終日</th></tr></thead><tbody>' +
    Object.keys(best).sort((a, b) => best[b].last.localeCompare(best[a].last)).map(k => {
      const b = best[k];
      return '<tr><td>' + esc(k) + '</td><td>' + (b.w ? fmt(b.w) + 'kg' : '自重') + '×' + b.wr + '</td><td>' + (b.e ? fmt(b.e) + 'kg' : '—') + '</td><td>' + esc(b.last.slice(5).replace('-', '/')) + '</td></tr>';
    }).join('') + '</tbody></table></div><p class="hint">推定MAXは重量と回数から計算した目安です（Epley式）。</p>';
  h += '<h2>記録</h2>' + days.map(d => '<div class="day"><div class="dh">' + esc(fmtD(d.date)) + '</div>' + d.items.map((it, i) => {
    const sets = it.sets || [], vol = sets.reduce((t, s) => t + (s.w || 0) * (s.r || 0), 0);
    return '<div class="li"><div class="lt"><b>' + esc(it.ex) + '</b>' + rec(p, '<button class="mini" data-act="editLog" data-date="' + esc(d.date) + '" data-i="' + i + '">編集</button>') + '</div>' +
      '<div class="sets">' + sets.map(s => '<span>' + (s.w ? fmt(s.w) + 'kg' : '自重') + ' × ' + s.r + '</span>').join('') + '</div>' +
      (it.memo ? '<div class="memo">' + esc(it.memo) + '</div>' : '') +
      '<div class="vol">' + sets.length + 'セット' + (vol ? '・合計 ' + fmt(vol) + 'kg' : '') + '</div></div>';
  }).join('') + '</div>').join('');
  return h;
}
function setRow(i, s) {
  return '<div class="setrow"><span class="sn">' + (i + 1) + '</span><input class="sw" type="number" step="any" inputmode="decimal" placeholder="kg" value="' + esc(s.w == null ? '' : s.w) + '"><input class="sr" type="number" step="1" inputmode="numeric" placeholder="回" value="' + esc(s.r == null ? '' : s.r) + '"><button type="button" class="xd" data-delset aria-label="削除">×</button></div>';
}
function logForm(p, date, idx) {
  const day = date ? logs.find(d => d.date === date) : null, it = day && idx != null ? day.items[idx] : null;
  const isOther = !!(it && !EX.includes(it.ex));
  const sets = it ? it.sets : [{}, {}, {}];
  const body = '<label>日付<input type="date" name="date" value="' + (date || today()) + '"></label>' +
    '<label>種目<select name="ex">' + EX.map(e => '<option' + (it && it.ex === e ? ' selected' : '') + '>' + e + '</option>').join('') + '<option value="__other"' + (isOther ? ' selected' : '') + '>その他（自分で入力）</option></select></label>' +
    '<label class="exo" style="display:' + (isOther ? 'block' : 'none') + '">種目名<input name="exo" value="' + (isOther ? esc(it.ex) : '') + '" placeholder="例：ヒップスラスト"></label>' +
    '<div class="seth"><span>セット</span><span>重量（kg）</span><span>回数</span><span></span></div><div class="setrows">' + sets.map((s, i) => setRow(i, s)).join('') + '</div>' +
    '<button type="button" class="btn" data-addset>＋ セットを追加</button>' +
    '<label style="margin-top:14px">メモ（任意）<input name="memo" value="' + esc(it && it.memo || '') + '" placeholder="例：フォーム意識、余裕あり"></label>' +
    '<p class="hint">自重の種目は重量を空欄（0kg）にしてください。</p>';
  modal(it ? 'トレーニング記録の編集' : 'トレーニングを記録', body, (fd, m) => {
    const d = fd.get('date'); if (!d) return '日付を入力してください';
    let ex = fd.get('ex'); if (ex === '__other') ex = String(fd.get('exo') || '').trim(); if (!ex) return '種目名を入力してください';
    const ss = [...m.querySelectorAll('.setrow')].map(r => ({ w: num(r.querySelector('.sw').value), r: num(r.querySelector('.sr').value) }))
      .filter(s => s.r != null && s.r > 0).map(s => ({ w: s.w == null ? 0 : s.w, r: Math.round(s.r) }));
    if (!ss.length) return '回数を1セット以上入力してください';
    const item = { ex, sets: ss }; const memo = String(fd.get('memo') || '').trim(); if (memo) item.memo = memo;
    const target = logs.find(x => x.date === d);
    if (it && date !== d) {
      saveDay(p, date, day.items.filter((_, i) => i !== idx));
      saveDay(p, d, (target ? target.items : []).concat([item]));
    } else if (it) { const items = day.items.slice(); items[idx] = item; saveDay(p, d, items); }
    else saveDay(p, d, (target ? target.items : []).concat([item]));
  }, {
    extra: it ? '<button type="button" class="btn ghost" data-dellog>この種目を削除</button>' : '',
    setup: m => {
      const sel = m.querySelector('select[name=ex]'), exo = m.querySelector('.exo'), rows = m.querySelector('.setrows');
      sel.onchange = () => { exo.style.display = sel.value === '__other' ? 'block' : 'none'; };
      const renum = () => rows.querySelectorAll('.sn').forEach((x, i) => { x.textContent = i + 1; });
      m.querySelector('[data-addset]').onclick = () => {
        const last = rows.lastElementChild, w = last ? last.querySelector('.sw').value : '', r = last ? last.querySelector('.sr').value : '';
        rows.insertAdjacentHTML('beforeend', setRow(rows.children.length, { w, r })); renum();
      };
      rows.addEventListener('click', e => { const b = e.target.closest('[data-delset]'); if (!b) return; if (rows.children.length > 1) { b.parentElement.remove(); renum(); } else { b.parentElement.querySelectorAll('input').forEach(x => { x.value = ''; }); } });
      const del = m.querySelector('[data-dellog]');
      if (del) del.onclick = () => { if (del.dataset.c) { m.remove(); saveDay(p, date, day.items.filter((_, i) => i !== idx)); render(); } else { del.dataset.c = 1; del.textContent = 'もう一度押すと削除'; } };
    }
  });
}

/* ---------- イベント ---------- */
document.addEventListener('submit', e => {
  if (!e.target.matches('#loginForm')) return;
  e.preventDefault();
  const fd = new FormData(e.target), err = document.getElementById('loginErr'), btn = e.target.querySelector('button');
  const id = String(fd.get('lid') || '').trim(), pw = String(fd.get('pw') || '');
  if (!id || !pw) { err.textContent = 'IDとパスワードを入力してください'; return; }
  btn.disabled = true; err.textContent = '';
  signInWithEmailAndPassword(auth, toEmail(id), pw).catch(ex => {
    btn.disabled = false;
    const c = ex && ex.code;
    err.textContent = c === 'auth/too-many-requests' ? '試行回数が多すぎます。しばらく待ってから再度お試しください' :
      c === 'auth/network-request-failed' ? '通信できません。電波状況を確認してください' : 'IDまたはパスワードが違います';
  });
});
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.closest('.mask')) return;
  const r = route(), p = (r.v === 'player' || r.v === 'train') ? find(r.id) : null;
  switch (a.dataset.act) {
    case 'addPlayer': playerForm(); break;
    case 'editPlayer': if (p) playerForm(p); break;
    case 'record': if (p && canRec(p)) recordForm(p); break;
    case 'editRec': if (p && canRec(p)) recordForm(p, a.dataset.date); break;
    case 'targets': if (p) targetForm(p); break;
    case 'delPlayer': if (p) delForm(p); break;
    case 'sort': sortK = sortK === a.dataset.k ? null : a.dataset.k; render(); break;
    case 'csv': csvModal(); break;
    case 'account': accountModal(); break;
    case 'addLog': if (p && canRec(p)) logForm(p); break;
    case 'editLog': if (p && canRec(p)) logForm(p, a.dataset.date, +a.dataset.i); break;
  }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();

</script>
