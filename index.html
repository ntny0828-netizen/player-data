<title>選手データ管理</title>
<style>
:root{--navy:#0b4a2b;--red:#136b3d;--stitch:#b8202f;--bg:#f4eddc;--card:#fffcf4;--line:#e3d8bf;--mut:#6f6650;--g:#1f8a4c;--b:#c49a2c;--o:#c0582a;--ink:#1f2a1f}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
.top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.ball{width:18px;height:18px;border-radius:50%;background:var(--card);box-shadow:inset 3px 0 0 -1px var(--red),inset -3px 0 0 -1px var(--red)}
.st{font-size:12px;opacity:.8}
.tabs{display:flex;background:var(--navy);padding:0 8px}
.tabs a{flex:1;text-align:center;color:#d9ccad;text-decoration:none;padding:10px;font-size:14px;border-bottom:3px solid transparent}
.tabs a.on{color:#fff;border-color:var(--stitch);font-weight:700}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h1 small{font-size:13px;color:var(--mut);font-weight:400}
h2{font-size:16px;margin:24px 0 8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.btn{font:inherit;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:600}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--stitch);border-color:transparent}
.empty{background:var(--card);border:1px dashed #d9ccad;border-radius:14px;padding:28px 20px;text-align:center;color:var(--mut);font-size:14px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pcard{display:block;background:var(--card);border-radius:14px;padding:14px;text-decoration:none;color:inherit;border:1px solid var(--line)}
.pn{font-weight:700;font-size:16px}.pm{color:var(--mut);font-size:13px;margin-top:2px;font-weight:400}
.pr{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:700}
.pr .pbar{flex:1;margin:0}
.pd{font-size:12px;color:var(--mut);margin-top:6px}
.pbar{height:8px;background:#e8dfc8;border-radius:99px;overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.pbar.g i{background:var(--g)}.pbar.b i{background:var(--b)}.pbar.o i{background:var(--o)}
.back{display:inline-block;color:var(--navy);text-decoration:none;font-size:14px;margin-bottom:8px}
.phead{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.ov{text-align:center}.ov b{display:block;font-size:24px;color:var(--navy)}.ov span{font-size:11px;color:var(--mut)}
.acts{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.acts .pri{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line)}
.card.done{border-color:var(--g);box-shadow:0 0 0 1px var(--g) inset}
.mn{font-size:12px;color:var(--mut);font-weight:600}
.cv{font-size:24px;font-weight:800;margin-top:4px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cv small{font-size:12px;font-weight:600;color:var(--mut);margin-left:2px}
.na{font-size:15px;color:#a89f88;font-weight:600}
.dl{font-size:12px;font-weight:700;color:var(--mut)}.dl.good{color:var(--g)}.dl.bad{color:var(--o)}
.tg{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;margin-top:4px}
.ok{color:var(--g);font-weight:800}
.spark{width:100%;height:34px;margin-top:6px;display:block}
.spark polyline{fill:none;stroke:var(--navy);stroke-width:2;vector-effect:non-scaling-stroke}
.spark .tl{stroke:var(--stitch);stroke-dasharray:4 3;stroke-width:1;vector-effect:non-scaling-stroke}
.tw{overflow-x:auto;background:var(--card);border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--mut);font-weight:600;background:#f7f0de}
th small{display:block;font-weight:400}
th:first-child,td:first-child{text-align:left}
.tt th[data-act]{cursor:pointer}.tt th.on{color:var(--stitch)}
.tt td:first-child{position:sticky;left:0;background:var(--card);z-index:1;font-weight:700}
.tt th:first-child{position:sticky;left:0;z-index:2}
.tt td span{color:var(--mut);font-size:11px;margin-left:3px}
.tt td.g{background:#e3f2e4}.tt td.b{background:#f8efd6}.tt td.o{background:#f9e7dc}
.tt a{color:inherit;text-decoration:none}
.mini{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 8px}
.hint{font-size:12px;color:var(--mut);margin:6px 0}
.danger{text-align:center;margin:28px 0 8px}
.mask{position:fixed;inset:0;background:rgba(17,24,39,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;margin:0}
@media(min-width:600px){.mask{align-items:center}.sheet{border-radius:18px}}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh h3{margin:0;font-size:16px}.x{border:0;background:none;font-size:24px;line-height:1;color:var(--mut);cursor:pointer}
.sb{padding:14px 16px;overflow-y:auto}
.sf{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.sf .ghost{margin-right:auto}
label{display:block;font-size:13px;font-weight:600;margin-bottom:12px}
.u{font-weight:400;color:var(--mut);margin-left:4px;font-size:12px}
input,select,textarea{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;padding:9px 10px;border:1px solid #d6c9a8;border-radius:9px;background:var(--card);color:var(--ink)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.err{color:var(--stitch);font-size:13px;margin:0}
textarea{height:200px;font-size:12px;font-family:ui-monospace,monospace}

.hr{display:flex;align-items:center;gap:10px}
.acct{font:inherit;font-size:13px;color:#fff;background:rgba(255,255,255,.12);border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
.ro{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 12px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--navy)}
.lbox{background:var(--card);border-radius:18px;padding:24px 20px;width:100%;max-width:360px}
.lbrand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.ball.big{width:44px;height:44px;box-shadow:inset 7px 0 0 -2px var(--red),inset -7px 0 0 -2px var(--red),0 0 0 2px #e8dfc8}
.btn.wide{width:100%;padding:12px;font-size:16px;margin-top:4px}
.btn:disabled{opacity:.6}
.mine{display:flex;flex-direction:column;gap:2px;background:var(--navy);color:#fff;text-decoration:none;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.mine span{font-size:12px;opacity:.75}.mine b{font-size:18px}.mine em{font-style:normal;font-size:13px;color:#f3e3b3;font-weight:700;margin-top:4px}
.mx{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--navy);border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.seg{display:flex;background:#e8dfc8;border-radius:12px;padding:3px;margin:12px 0 0}
.seg a{flex:1;text-align:center;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:700;color:var(--mut);text-decoration:none}
.seg a.on{background:var(--card);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.dh{background:#f7f0de;padding:8px 14px;font-size:13px;font-weight:700;color:var(--navy);border-bottom:1px solid var(--line)}
.li{padding:10px 14px;border-bottom:1px solid var(--line)}.li:last-child{border-bottom:0}
.lt{display:flex;justify-content:space-between;align-items:center;gap:8px}.lt b{font-size:15px}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sets span{background:#e6f0e4;color:var(--navy);font-size:13px;font-weight:700;border-radius:8px;padding:4px 8px}
.memo{font-size:13px;color:#3d3a2f;margin-top:6px}
.vol{font-size:12px;color:var(--mut);margin-top:6px}
.seth,.setrow{display:grid;grid-template-columns:36px 1fr 1fr 36px;gap:8px;align-items:center}
.seth{font-size:12px;color:var(--mut);font-weight:600;margin-bottom:2px}
.setrow{margin-bottom:8px}.setrow input{margin-top:0}
.sn{text-align:center;font-weight:800;color:var(--navy)}
.xd{border:0;background:#efe6cf;border-radius:8px;height:40px;font-size:18px;color:var(--mut);cursor:pointer}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:42px;text-align:left}
input{min-width:0}

.logo{width:30px;height:30px;border-radius:50%;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.logo.big{width:96px;height:96px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top{background:linear-gradient(180deg,#0d5532,#0b4a2b)}
.tabs{border-bottom:1px solid rgba(255,255,255,.08)}
.btn.pri{box-shadow:0 1px 0 rgba(0,0,0,.08)}
.login{background:radial-gradient(circle at 50% 30%,#13603a,#0a3f25)}
.lbox{background:var(--card)}
.pcard,.card,.phead,.tw,.day,.empty{background:var(--card)}
.seg{background:#e8dfc8}
.tsub{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--mut);margin-top:2px}
.newt{display:block;width:100%;margin-top:8px;font:inherit;font-size:12px;font-weight:700;color:var(--red);background:#e3f2e4;border:1px dashed var(--g);border-radius:8px;padding:6px;cursor:pointer}
</style>

  { k: 'dead', mx: true, n: 'デッドリフト', u: 'kg' },

const GR = ['1年', '2年', '3年'];

let S = { players: [] }, sortK = null, status = '', loaded = false, authReady = false, user = null, isCoach = false, unsub = null;
let auth = null, fs = null;
let logs = [], logsLoaded = false, logsPid = null, logsUnsub = null;
const configured = !String(firebaseConfig.apiKey).startsWith('ここ');

const toEmail = id => { id = String(id || '').trim().toLowerCase(); return id.includes('@') ? id : id + '@' + ID_DOMAIN; };
const showId = email => { email = String(email || ''); return email.endsWith('@' + ID_DOMAIN) ? email.slice(0, -ID_DOMAIN.length - 1) : email; };

if (configured) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  fs = getFirestore(app);
  onAuthStateChanged(auth, u => {
    user = u; authReady = true;
    if (unsub) { unsub(); unsub = null; }
    if (logsUnsub) { logsUnsub(); logsUnsub = null; } logsPid = null; logs = []; logsLoaded = false;
    S.players = []; loaded = false; setStatus('');
    if (u) {
      isCoach = COACH_IDS.map(toEmail).includes(String(u.email || '').toLowerCase());
      unsub = onSnapshot(collection(fs, 'players'), snap => {
        S.players = snap.docs.map(d => {
          const x = d.data() || {};
          return { id: d.id, name: x.name || '', grade: x.grade || '', pos: x.pos || '', account: x.account || '', targets: x.targets || {}, tgtLog: x.tgtLog || {}, records: x.records || [], updatedAt: x.updatedAt || '', updatedBy: x.updatedBy || '' };
        });
        loaded = true; render();
      }, err => { loaded = true; setStatus(err && err.code === 'permission-denied' ? 'denied' : 'err'); render(); });
    }
    render();
  });
}

/* ---------- 共通 ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const num = x => (x == null || x === '' || isNaN(+x)) ? null : +x;
const fmt = v => v == null ? '—' : String(Math.round(v * 100) / 100);
const series = (p, k) => p.records.filter(r => num(r.values && r.values[k]) != null).sort((a, b) => a.date.localeCompare(b.date)).map(r => ({ date: r.date, v: +r.values[k] }));
const cur = (p, k) => { const s = series(p, k); return s.length ? s[s.length - 1].v : null; };
const tgtInfo = (p, k) => { const l = (p.tgtLog && p.tgtLog[k]) || []; return l.length ? l[l.length - 1] : null; };
const prevTgt = (p, k) => { const l = ((p.tgtLog && p.tgtLog[k]) || []).filter(e => e.v != null); return l.length > 1 ? l[l.length - 2] : null; };
function baseVal(p, k, s) { return s[0].v; } // 達成度は常に最初の記録から
function prog(p, k) {
  const t = num(p.targets[k]), s = series(p, k); if (t == null || !s.length) return null;
  const st = baseVal(p, k, s), c = s[s.length - 1].v, reached = t >= st ? c >= t : c <= t;
  if (reached) return 1; if (t === st) return 0;
  return Math.max(0, Math.min(1, (c - st) / (t - st)));
}
function overall(p) { const a = M.map(m => prog(p, m.k)).filter(x => x != null); return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
const lastDate = p => p.records.reduce((m, r) => r.date > m ? r.date : m, '');
const barCls = pr => pr == null ? '' : pr >= 1 ? 'g' : pr >= .5 ? 'b' : 'o';
const sorted = () => S.players.slice().sort((a, b) => GR.indexOf(b.grade) - GR.indexOf(a.grade) || a.name.localeCompare(b.name, 'ja'));
const pct = x => Math.round(x * 100) + '%';
const rw = h => isCoach ? h : '';
const myEmail = () => String(user && user.email || '').toLowerCase();
const isMine = p => !!(p && p.account && p.account === myEmail());
const canRec = p => isCoach || isMine(p);
const rec = (p, h) => canRec(p) ? h : '';
const myPlayer = () => S.players.find(isMine);
const find = id => S.players.find(x => x.id === id);

/* ---------- 保存 ---------- */
const ST = { saving: '保存中…', saved: '保存しました', err: '通信エラー', denied: '権限がありません', ro: '閲覧のみ' };
function setStatus(s) { status = s; const el = document.getElementById('st'); if (el) el.textContent = ST[s] || ''; }
const chains = {};
function queue(id, fn) {
  setStatus('saving');
  chains[id] = (chains[id] || Promise.resolve()).then(fn).then(() => setStatus('saved'), e => setStatus(e && e.code === 'permission-denied' ? 'denied' : 'err'));
}
function save(p) {
  const stamp = { updatedAt: new Date().toISOString(), updatedBy: showId(user && user.email) };
  if (!isCoach) { // 選手本人は測定記録だけを更新
    queue(p.id, () => updateDoc(doc(fs, 'players', p.id), Object.assign({ records: p.records, targets: p.targets, tgtLog: p.tgtLog || {} }, stamp)));
    return;
  }
  const body = Object.assign({ name: p.name, grade: p.grade, pos: p.pos, account: p.account || '', targets: p.targets, tgtLog: p.tgtLog || {}, records: p.records }, stamp);
  queue(p.id, () => setDoc(doc(fs, 'players', p.id), body));
}
function removeP(p) { queue(p.id, () => deleteDoc(doc(fs, 'players', p.id))); }

/* ---------- 画面 ---------- */
function route() { const h = location.hash.slice(1); if (h === 'team') return { v: 'team' }; if (h.indexOf('p-') === 0) return { v: 'player', id: h.slice(2) }; if (h.indexOf('t-') === 0) return { v: 'train', id: h.slice(2) }; return { v: 'home' }; }
function render() {
  const root = document.getElementById('root');
  if (!configured) { root.innerHTML = '<div class="login"><div class="lbox"><h1>初期設定が必要です</h1><p class="hint">index.html の先頭にある firebaseConfig に、Firebaseの設定値を貼り付けてください（手順書の「手順4」）。</p></div></div>'; return; }
  if (!authReady) { root.innerHTML = '<div class="login"><div class="lbox"><p class="hint">読み込み中…</p></div></div>'; return; }
  if (!user) { root.innerHTML = loginView(); return; }
  const r = route();
  ensureLogs(r.v === 'train' && loaded && find(r.id) ? r.id : null);
  let h = '<header class="top"><div class="brand"><img class="logo" src="' + LOGO_S + '" alt="">選手データ管理</div><div class="hr"><span class="st" id="st">' + (ST[status] || '') + '</span><button class="acct" data-act="account">' + esc(showId(user.email)) + ' ▾</button></div></header>' +
    '<nav class="tabs"><a href="#" class="' + (r.v !== 'team' ? 'on' : '') + '">選手</a><a href="#team" class="' + (r.v === 'team' ? 'on' : '') + '">チーム一覧</a></nav><main>';
  if (!isCoach && loaded) {
    const mp = myPlayer();
    h += mp ? '<a class="mine" href="#p-' + mp.id + '"><span>あなたの記録</span><b>' + esc(mp.name) + '</b><em>測定・トレーニングを入力する ›</em></a>'
      : '<p class="hint ro">あなたのIDはまだ選手に紐付けられていないため、閲覧のみです。コーチに「選手情報の編集」でログインIDを登録してもらってください。</p>';
  }
  if (!loaded) h += '<div class="empty">読み込み中…</div>';
  else if (r.v === 'team') h += teamView();
  else if (r.v === 'player') { const p = find(r.id); h += p ? playerView(p) : homeView(); }
  else if (r.v === 'train') { const p = find(r.id); h += p ? trainView(p) : homeView(); }
  else h += homeView();
  root.innerHTML = h + '</main>';
}
function loginView() {
  return '<div class="login"><form class="lbox" id="loginForm"><div class="lbrand"><img class="logo big" src="' + LOGO_L + '" alt=""><h1>選手データ管理</h1></div>' +
    '<label>ログインID<input name="lid" autocomplete="username" autocapitalize="none" spellcheck="false"></label>' +
    '<label>パスワード<input name="pw" type="password" autocomplete="current-password"></label>' +
    '<p class="err" id="loginErr"></p><button class="btn pri wide" type="submit">ログイン</button>' +
    '<p class="hint">IDとパスワードはコーチから受け取ってください。</p></form></div>';
}
function homeView() {
  const ps = sorted();
  let h = '<div class="bar"><h1>選手一覧 <small>' + ps.length + '名</small></h1>' + rw('<button class="btn pri" data-act="addPlayer">＋ 選手を追加</button>') + '</div>';
  if (!ps.length) return h + '<div class="empty"><p>まだ選手が登録されていません。</p>' + rw('<p>「＋ 選手を追加」から登録し、目標値と測定値を入力していきましょう。</p>') + '</div>';

function card(p, m) {

function spark(s, t) {

  const tl = t != null ? '<line class="tl" x1="0" x2="' + w + '" y1="' + Y(t) + '" y2="' + Y(t) + '"/>' : '';
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' + tl + '<polyline points="' + s.map((x, i) => X(i) + ',' + Y(x.v)).join(' ') + '"/></svg>';
}

const EX = ['スクワット', 'デッドリフト', 'ベンチプレス', 'ブルガリアンスクワット', 'ルーマニアンデッドリフト', 'バックランジ', 'サイドランジ'];

  const best = {};
  days.forEach(d => d.items.forEach(it => {

    (it.sets || []).forEach(s => { if (s.w > b.w || (s.w === b.w && s.r > b.wr)) { b.w = s.w; b.wr = s.r; } const e = e1rm(s.w, s.r); if (e > b.e) b.e = e; });

  const sets = it ? it.sets : [{}, {}, {}];
  const body = '<label>日付<input type="date" name="date" value="' + (date || today()) + '"></label>' +
    '<label>種目<select name="ex">' + EX.map(e => '<option' + (it && it.ex === e ? ' selected' : '') + '>' + e + '</option>').join('') + '<option value="__other"' + (isOther ? ' selected' : '') + '>その他（自分で入力）</option></select></label>' +
    '<label class="exo" style="display:' + (isOther ? 'block' : 'none') + '">種目名<input name="exo" value="' + (isOther ? esc(it.ex) : '') + '" placeholder="例：ヒップスラスト"></label>' +
    '<div class="seth"><span>セット</span><span>重量（kg）</span><span>回数</span><span></span></div><div class="setrows">' + sets.map((s, i) => setRow(i, s)).join('') + '</div>' +
    '<button type="button" class="btn" data-addset>＋ セットを追加</button>' +
    '<label style="margin-top:14px">メモ（任意）<input name="memo" value="' + esc(it && it.memo || '') + '" placeholder="例：フォーム意識、余裕あり"></label>' +
    '<p class="hint">自重の種目は重量を空欄（0kg）にしてください。</p>';
  modal(it ? 'トレーニング記録の編集' : 'トレーニングを記録', body, (fd, m) => {
    const d = fd.get('date'); if (!d) return '日付を入力してください';
    let ex = fd.get('ex'); if (ex === '__other') ex = String(fd.get('exo') || '').trim(); if (!ex) return '種目名を入力してください';
    const ss = [...m.querySelectorAll('.setrow')].map(r => ({ w: num(r.querySelector('.sw').value), r: num(r.querySelector('.sr').value) }))
      .filter(s => s.r != null && s.r > 0).map(s => ({ w: s.w == null ? 0 : s.w, r: Math.round(s.r) }));
    if (!ss.length) return '回数を1セット以上入力してください';
    const item = { ex, sets: ss }; const memo = String(fd.get('memo') || '').trim(); if (memo) item.memo = memo;
    const target = logs.find(x => x.date === d);
    if (it && date !== d) {
      saveDay(p, date, day.items.filter((_, i) => i !== idx));
      saveDay(p, d, (target ? target.items : []).concat([item]));
    } else if (it) { const items = day.items.slice(); items[idx] = item; saveDay(p, d, items); }
    else saveDay(p, d, (target ? target.items : []).concat([item]));
  }, {
    extra: it ? '<button type="button" class="btn ghost" data-dellog>この種目を削除</button>' : '',
    setup: m => {
      const sel = m.querySelector('select[name=ex]'), exo = m.querySelector('.exo'), rows = m.querySelector('.setrows');
      sel.onchange = () => { exo.style.display = sel.value === '__other' ? 'block' : 'none'; };
      const renum = () => rows.querySelectorAll('.sn').forEach((x, i) => { x.textContent = i + 1; });
      m.querySelector('[data-addset]').onclick = () => {
        const last = rows.lastElementChild, w = last ? last.querySelector('.sw').value : '', r = last ? last.querySelector('.sr').value : '';
        rows.insertAdjacentHTML('beforeend', setRow(rows.children.length, { w, r })); renum();
      };
      rows.addEventListener('click', e => { const b = e.target.closest('[data-delset]'); if (!b) return; if (rows.children.length > 1) { b.parentElement.remove(); renum(); } else { b.parentElement.querySelectorAll('input').forEach(x => { x.value = ''; }); } });
      const del = m.querySelector('[data-dellog]');
      if (del) del.onclick = () => { if (del.dataset.c) { m.remove(); saveDay(p, date, day.items.filter((_, i) => i !== idx)); render(); } else { del.dataset.c = 1; del.textContent = 'もう一度押すと削除'; } };
    }
  });
}

/* ---------- イベント ---------- */
document.addEventListener('submit', e => {
  if (!e.target.matches('#loginForm')) return;
  e.preventDefault();
  const fd = new FormData(e.target), err = document.getElementById('loginErr'), btn = e.target.querySelector('button');
  const id = String(fd.get('lid') || '').trim(), pw = String(fd.get('pw') || '');
  if (!id || !pw) { err.textContent = 'IDとパスワードを入力してください'; return; }
  btn.disabled = true; err.textContent = '';
  signInWithEmailAndPassword(auth, toEmail(id), pw).catch(ex => {
    btn.disabled = false;
    const c = ex && ex.code;
    err.textContent = c === 'auth/too-many-requests' ? '試行回数が多すぎます。しばらく待ってから再度お試しください' :
      c === 'auth/network-request-failed' ? '通信できません。電波状況を確認してください' : 'IDまたはパスワードが違います';
  });
});
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.closest('.mask')) return;
  const r = route(), p = (r.v === 'player' || r.v === 'train') ? find(r.id) : null;
  switch (a.dataset.act) {
    case 'addPlayer': playerForm(); break;
    case 'editPlayer': if (p) playerForm(p); break;
    case 'record': if (p && canRec(p)) recordForm(p); break;
    case 'editRec': if (p && canRec(p)) recordForm(p, a.dataset.date); break;
    case 'targets': if (p && canRec(p)) targetForm(p); break;
    case 'delPlayer': if (p) delForm(p); break;
    case 'sort': sortK = sortK === a.dataset.k ? null : a.dataset.k; render(); break;
    case 'csv': csvModal(); break;
    case 'account': accountModal(); break;
    case 'addLog': if (p && canRec(p)) logForm(p); break;
    case 'editLog': if (p && canRec(p)) logForm(p, a.dataset.date, +a.dataset.i); break;
  }
});
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();

</script>
</body>
</html>
